# A single Kafka broker (KRaft mode: no ZooKeeper) plus a web UI.
# The services run on your machine as plain Node processes (npm run dev:all).
name: day18-kafka

services:
  kafka:
    # Pinned to 3.9: kafkajs doesn't speak some of the newer protocol versions
    # that Kafka 4.x requires.
    image: apache/kafka:3.9.1
    container_name: day18-kafka
    ports:
      - "9092:9092" # what the Node code connects to
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # one process does both jobs
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two doors in: "kafka:19092" for other containers (the UI), and
      # "localhost:9092" for code running on your machine.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker, so nothing can be replicated to a second copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose, with a chosen partition count.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Keep events for 7 days whether or not anyone has read them.
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 15

  kafka-ui:
    # http://localhost:8085 : topics, partitions, messages, and each consumer
    # group's offsets and lag.
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: day18-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: day18
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafkadata:
